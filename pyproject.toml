[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripcaspian"
version = "0.1.0"
description = "A multi-channel trip-planning & booking agent powered by Caspian SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "caspian-sdk>=0.1.0",
    "apscheduler>=3.10.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
